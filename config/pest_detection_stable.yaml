# YOLO11m Stable Training Configuration
# FIXES: Gradient explosion from class imbalance + aggressive augmentation
# Strategy: Reduce LR, disable advanced augmentation, use FP32

# Model
model: yolo11m.pt
task: detect

# Training
epochs: 150
patience: 30               # Increased (imbalanced datasets learn slower)
save_period: 10

# Hardware optimization
img_size: 640
batch_size: 6              # Reduced for FP32 stability
workers: 8
accumulate: 4              # Increased (effective batch = 24, more stable)
amp: false                 # CRITICAL: Disable FP16 to prevent NaN

# Optimizer (CONSERVATIVE)
optimizer: AdamW
lr0: 0.001                 # 10× LOWER learning rate
lrf: 0.0001                # Gentler decay
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 10          # 2× LONGER warmup
warmup_momentum: 0.8
warmup_bias_lr: 0.01       # Lower bias LR
cos_lr: true

# Augmentation (MINIMAL - only safe transforms)
hsv_h: 0.01                # Reduced from 0.02
hsv_s: 0.4                 # Reduced from 0.8
hsv_v: 0.4                 # Reduced from 0.5
degrees: 15.0              # Reduced from 30.0
translate: 0.1             # Reduced from 0.15
scale: 0.3                 # Reduced from 0.6
shear: 0.0                 # DISABLED
perspective: 0.0           # DISABLED
flipud: 0.0                # DISABLED (pests have orientation)
fliplr: 0.5                # Keep (safe for pests)
mosaic: 0.0                # DISABLED (causes label chaos on imbalanced data)
mixup: 0.0                 # DISABLED
copy_paste: 0.0            # DISABLED
close_mosaic: 0            # N/A (mosaic disabled)

# Validation
val: true
plots: true
save_json: true
save_hybrid: false

# Device
device: cuda:0

# Project paths
project: models/pest_detection_stable
name: train
exist_ok: false
