# YOLO11n Fast Testing Configuration (30-60 min training)
# Use for pipeline validation and quick testing

# Model (smaller, faster)
model: yolo11n.pt
task: detect

# Training (reduced)
epochs: 50              # Reduced from 150
patience: 10            # Reduced from 20
save_period: 10

# Hardware optimization
img_size: 512           # Reduced from 640 (faster)
batch_size: 16          # Increased (smaller model allows more)
workers: 8
accumulate: 1           # No accumulation needed
amp: true

# Optimizer
optimizer: AdamW
lr0: 0.01
lrf: 0.001
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
cos_lr: true

# Augmentation (AGGRESSIVE for imbalanced data - 102 classes, 11 minority)
hsv_h: 0.15             # 10x stronger: color variation for distinguishing minority classes
hsv_s: 0.8              # Saturation robustness
hsv_v: 0.5              # Brightness robustness
degrees: 45.0           # 3x stronger rotation
translate: 0.2          # 2x stronger translation
scale: 0.7              # Stronger zoom variation
shear: 5.0              # Add shearing (new)
perspective: 0.001      # Add perspective (new)
flipud: 0.3             # Vertical flips for minority classes
fliplr: 0.5             # Horizontal flips
mosaic: 1.0             # Keep mosaic
mixup: 0.3              # 3x stronger mixup - critical for imbalanced data
copy_paste: 0.3         # Critical for small/rare objects

# Validation
val: true
plots: true
save_json: true

# Device
device: cuda:0

# Project paths
project: models/pest_detection_fast
name: train
exist_ok: false
