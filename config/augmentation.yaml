# Augmentation Configuration for Minority Classes
# Storage-efficient on-the-fly augmentation

# Analysis parameters
minority_percentile: 10        # Classes below 10th percentile are considered minority
target_samples_per_class: 100  # Target number of samples after augmentation

# Augmentation severity levels
severity: medium  # Options: light, medium, heavy

# Light augmentation
light:
  HorizontalFlip:
    p: 0.5
  RandomBrightnessContrast:
    brightness_limit: 0.15
    contrast_limit: 0.15
    p: 0.3
  Rotate:
    limit: 15
    p: 0.3

# Medium augmentation (recommended for pest detection)
medium:
  HorizontalFlip:
    p: 0.5
  VerticalFlip:
    p: 0.3
  RandomBrightnessContrast:
    brightness_limit: 0.2
    contrast_limit: 0.2
    p: 0.5
  Rotate:
    limit: 30
    p: 0.5
  GaussNoise:
    var_limit: [10, 50]
    p: 0.3
  RandomScale:
    scale_limit: 0.1
    p: 0.3
  ColorJitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
    p: 0.4

# Heavy augmentation (for very small minority classes)
heavy:
  HorizontalFlip:
    p: 0.5
  VerticalFlip:
    p: 0.4
  RandomBrightnessContrast:
    brightness_limit: 0.3
    contrast_limit: 0.3
    p: 0.6
  Rotate:
    limit: 45
    p: 0.6
  GaussNoise:
    var_limit: [10, 80]
    p: 0.4
  RandomScale:
    scale_limit: 0.2
    p: 0.4
  ColorJitter:
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.15
    p: 0.5
  Blur:
    blur_limit: 3
    p: 0.2
  CLAHE:
    clip_limit: 2.0
    p: 0.2

# Advanced options
preserve_aspect_ratio: true
interpolation: bilinear
