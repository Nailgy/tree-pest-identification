# Stage 1 — YOLO11m leaf-detection training hyperparameters.
# Loaded by scripts/train_leaf_detector.py and passed straight into Ultralytics
# model.train(). Any key Ultralytics' train() accepts can be added here.
# Tuned for a single `leaf` class, ~432 training images, RTX 4070 8 GB.

# --- Model / data --------------------------------------------------------
model: yolo11m.pt          # pretrained COCO weights (transfer learning); auto-downloaded
data: dataset/data.yaml    # resolved relative to repo root by the train script

# --- Schedule ------------------------------------------------------------
epochs: 150
patience: 30               # early-stop if val mAP plateaus for 30 epochs
close_mosaic: 10           # disable mosaic for the final 10 epochs to stabilise

# --- Hardware / throughput ----------------------------------------------
imgsz: 416                 # native dataset size; Stage-2 SAHI tiles are also 416
batch: 16                  # conservative fit at 416 + AMP on 8 GB.
                           #   On the training PC you may push throughput with:
                           #     batch: 0.70   -> Ultralytics auto-sizes to ~70% VRAM
                           #     batch: 24     -> manual bump (watch nvidia-smi for OOM)
device: 0                  # first CUDA GPU
workers: 8                 # DataLoader workers (i9 has plenty of cores)
amp: true                  # mixed precision — saves ~40% VRAM
cache: false               # set true (RAM cache) only if you have headroom

# --- Optimizer -----------------------------------------------------------
optimizer: AdamW
lr0: 0.001
lrf: 0.01                  # final LR = lr0 * lrf
cos_lr: true               # cosine LR decay
warmup_epochs: 3

# --- Online augmentation (applied on-the-fly every epoch) ----------------
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 15.0              # leaves have no canonical orientation
translate: 0.1
scale: 0.5
fliplr: 0.5
flipud: 0.5                # vertical flip is safe for leaves
mosaic: 1.0
mixup: 0.1
copy_paste: 0.0

# --- Output --------------------------------------------------------------
project: runs/train
name: leaf_yolo11m
